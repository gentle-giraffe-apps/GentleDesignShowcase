name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-build:
    runs-on: macos-26

    defaults:
      run:
        working-directory: GentleDesignShowcase 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install Tuist
        run: mise install

      - name: Install xcresultparser
        run: brew install xcresultparser

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Set up Ruby (Bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: GentleDesignShowcase

      - name: Build (Fastlane)
        run: bundle exec fastlane ios unit_tests

      - name: Convert xcresult to coverage.xml
        run: |
          xcresultparser -o cobertura fastlane/test_output/*.xcresult > coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

